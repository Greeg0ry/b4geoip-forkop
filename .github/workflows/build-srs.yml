name: Build sing-box rule-sets from b4geoip

on:
  schedule:
    # 00:00 Europe/Moscow (UTC+3, no DST) == 21:00 UTC the previous day
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-srs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install geoip converter (Loyalsoldier/geoip)
        run: go install github.com/Loyalsoldier/geoip@master

      - name: Install sing-box (for rule-set compile)
        run: go install github.com/sagernet/sing-box/cmd/sing-box@latest

      - name: Download latest b4geoip release
        run: |
          curl -fsSL -o geoip.dat https://github.com/DanielLavrushin/b4geoip/releases/latest/download/geoip.dat
          curl -fsSL -o geoip.dat.sha256sum https://github.com/DanielLavrushin/b4geoip/releases/latest/download/geoip.dat.sha256sum
          sha256sum -c geoip.dat.sha256sum

      - name: Convert geoip.dat to sing-box .srs rule-sets
        run: |
          rm -rf srs
          geoip convert -c srs-config.json

      - name: Clean up downloaded files
        run: rm -f geoip.dat geoip.dat.sha256sum

      - name: Build xbox rule-set (geosite:xbox from geoexport.org)
        run: |
          curl -fsSL -o xbox-domains.txt \
            "https://geoexport.org/api/export?category=geosite%3Axbox&type=domains%2Cip4%2Cip6&format=plain-lines&source=runetfreedom"
          python3 - <<'PY'
          import json
          with open("xbox-domains.txt") as f:
              domains = sorted({line.strip() for line in f if line.strip()})
          data = {"version": 2, "rules": [{"domain_suffix": domains}]}
          with open("xbox-source.json", "w") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          sing-box rule-set compile xbox-source.json -o srs/xbox.srs
          rm -f xbox-domains.txt xbox-source.json

      - name: Check for changes
        id: diff
        run: |
          git add srs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(srs): update sing-box rule-sets from b4geoip ($(date -u +%F))"
          git push

      - name: Publish GitHub Release with .srs assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(TZ=Europe/Moscow date +'%Y-%m-%d_%H-%M')"
          gh release create "$tag" srs/*.srs \
            --title "$tag" \
            --notes "Собрано из последнего geoip.dat: https://github.com/DanielLavrushin/b4geoip/releases/latest"
