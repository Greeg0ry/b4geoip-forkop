name: Build sing-box rule-sets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-srs.yml
      - srs-config.json
      - game-sources.json
      - scripts/**
      - tests/**
  schedule:
    # 00:00 Europe/Moscow (UTC+3, no DST) == 21:00 UTC the previous day
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-srs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test game list conversion
        run: python3 -m unittest discover -s tests -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install geoip converter (Loyalsoldier/geoip)
        run: go install github.com/Loyalsoldier/geoip@master

      - name: Install sing-box (for rule-set compile)
        run: go install github.com/sagernet/sing-box/cmd/sing-box@latest

      - name: Build rule-sets (keep previous files if a source is unavailable)
        run: python3 -m scripts.build_rulesets

      - name: Check for changes
        id: diff
        run: |
          git add srs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(srs): update sing-box rule-sets ($(date -u +%F))"
          git push

      - name: Publish GitHub Release with .srs assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(TZ=Europe/Moscow date +'%Y-%m-%d_%H-%M')"
          gh release create "$tag" srs/*.srs \
            --title "$tag" \
            --notes "Источники: https://github.com/DanielLavrushin/b4geoip/releases/latest, https://github.com/YOZH3G/ru-gaming-blocklist, https://github.com/v2fly/domain-list-community (Xbox, Slack, Twitch). Недоступные списки сохраняются из предыдущей сборки; подробности в GitHub Actions."
